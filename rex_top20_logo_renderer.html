*{box-sizing:border-box}

.card{position:relative;width:100%;height:480px;overflow:hidden;border-radius:20px;background:#171922;isolation:isolate}
.poster{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}

.details{position:absolute;z-index:2;left:22px;right:22px;bottom:22px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;text-align:left;pointer-events:none}

.platform-name{display:block;max-width:76px;overflow:hidden;text-overflow:ellipsis;border-radius:5px;padding:3px 5px;background:rgba(0,0,0,.5);font-size:11px;font-weight:750;flex-shrink:0}
.meta-text{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:16px;font-weight:500;line-height:1.2;color:rgba(255,255,255,.84);text-shadow:0 1px 3px rgba(0,0,0,.5)}
.open{position:absolute;inset:0;z-index:3;display:block;width:100%;height:100%;border:0;border-radius:20px;outline:none;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card:focus-within::after,.card.focused::after{content:"";position:absolute;z-index:4;inset:3px;border:4px solid #fff;border-radius:17px;box-shadow:0 0 0 2px rgba(0,0,0,.4),0 0 18px rgba(255,255,255,.4);pointer-events:none}
.card:focus-within .poster,.card.focused .poster{filter:brightness(1.07)}
.status{position:absolute;z-index:2;left:20px;right:20px;bottom:22px;font-size:14px}
/* Apple TV ranking gradient. */
.rank{position:absolute;z-index:2;top:8px;left:8px;display:block;width:max-content;pointer-events:none;user-select:none;overflow:visible}
.rank::before,.rank::after{content:attr(data-digit);display:block;width:max-content;padding:.10em .20em .16em .12em;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-size:var(--rank-size,64px);font-weight:700;line-height:1.18;letter-spacing:-.045em;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.rank::before{position:absolute;inset:0 auto auto 0;color:transparent;-webkit-text-fill-color:transparent;text-shadow:0 1px 1px rgba(0,0,0,.06);mix-blend-mode:multiply}
.rank::after{position:relative;background-image:linear-gradient(to bottom,rgba(255,255,255,.98) 0%,rgba(255,255,255,.98) 50%,rgba(255,255,255,.60) 67%,rgba(255,255,255,.05) 86%,rgba(255,255,255,.05) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;-webkit-text-stroke:0;background-repeat:no-repeat;filter:drop-shadow(0 1px 1px rgba(0,0,0,.04));text-shadow:none}
[hidden]{display:none!important}
</style>
