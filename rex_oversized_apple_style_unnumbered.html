html,body{

.card{

 background:#171922;isolation:isolate
}
.poster{
 position:absolute;inset:0;

}
.shade{

.details{

.brand{

 flex-shrink:0
}
.logo{

}
.title{

 text-align:left;
 text-shadow:0 2px 7px rgba(0,0,0,.75)
}
.meta{
 display:flex;align-items:flex-start;
 gap:10px;width:100%;min-width:0
}
.platform-logo{

}
.meta-text{

 color:#fff;opacity:.62;
 text-shadow:0 1px 3px rgba(0,0,0,.5);

}
.open{
 position:absolute;inset:0;z-index:3;
 display:block;width:100%;height:100%;
 border:0;border-radius:26px;outline:none;
 background:transparent;cursor:pointer;
 -webkit-tap-highlight-color:transparent
}
.card:focus-within::after,
.card.focused::after{
 content:"";position:absolute;z-index:4;
 inset:4px;border:5px solid #fff;
 border-radius:22px;
 box-shadow:0 0 0 2px rgba(0,0,0,.4),
 0 0 18px rgba(255,255,255,.4);
 pointer-events:none
}
.card:focus-within .poster,
.card.focused .poster{filter:brightness(1.07)}
.status{
 position:absolute;z-index:2;
 left:26px;right:26px;bottom:25px;
 font-size:18px
}
[hidden]{display:none!important}
</style>
</head>

function readGenres(value,out,depth){
 if(value==null||depth>6||out.length>=2)
  return;

 if(Array.isArray(value)){
  for(var i=0;i<value.length&&out.length<2;i++){
   readGenres(value[i],out,depth+1);
  }
  return;
 }

 if(typeof value==='object'){
  readGenres(
   value.title||value.name||value.label||
   value.genreTitle||value.genre||
   value.category||value.value,
   out,depth+1
  );
  return;
 }

 if(typeof value!=='string')return;

 var pieces=value.split(/[·•・|,;\/、，]+/);

 for(var j=0;j<pieces.length&&out.length<2;j++){
  var raw=pieces[j].trim();
  var key=fold(raw);

  if(!raw||
   /^(global rank|streaming trend rank)\s*\d+$/.test(key)||
   key==='trending worldwide'){
   continue;
  }

  if(Object.prototype.hasOwnProperty.call(COMBINED,key)){
   var pair=COMBINED[key];

   for(var p=0;p<pair.length&&out.length<2;p++){
    add(out,pair[p]);
   }

   continue;
  }

  if(Object.prototype.hasOwnProperty.call(GENRES,key)){
   add(out,GENRES[key]);
   continue;
  }

  var split=raw.split(/\s+(?:and|&)\s+|\s*＆\s*/i);

  if(split.length>1){
   for(var k=0;k<split.length&&out.length<2;k++){
    readGenres(split[k],out,depth+1);
   }
  }else if(raw.length<=40){
   add(out,raw);
  }
 }
}

 try{
  var result=api.open('item',id);

  if(result&&typeof result.catch==='function'){
   result.catch(function(){});
  }
 }catch(e){}
}

var link=el('open');

link.addEventListener('click',function(e){
 e.preventDefault();
 openSelected();
});

link.addEventListener('focus',function(){
 el('card').classList.add('focused');
});

link.addEventListener('blur',function(){
 el('card').classList.remove('focused');
});

link.addEventListener('keydown',function(e){
 if(e.key==='Enter'||e.key==='Select'||
  e.key===' '||e.keyCode===13||e.keyCode===23){
  e.preventDefault();
  openSelected();
 }
});

if(api){
 api.onContentChanged(render);
 api.onLayoutChanged(updateLayout);
 render();
}

})();
</script>
</body>
</html>
