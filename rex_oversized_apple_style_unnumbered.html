
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="rex-widget" content="type=rail; height=700; item-ratio=4:5">
<meta name="rex-fields" content="posterPath,backdropPath,backdropPaths,cleanPosterPath,titleLogoPath,titleLogoUrl,logoPath,originalNetwork,networkLogoPath,genreTitle,genreItems,description,detailPoster,titleLogoAlternates,titleLogoRawPath,logoUrl,titleLogoPinned,faceSafePosterPath">
<title>Rex Editorial — Consistent Artwork</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;padding:0;width:100%;height:100%;
 background:transparent;color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,
 "Helvetica Neue",Arial,sans-serif
}
.card{
 position:relative;width:100%;height:700px;
 overflow:hidden;border-radius:26px;
 background:#171922;isolation:isolate
}
.poster{
 position:absolute;inset:0;
 width:100%;height:100%;
 display:block;object-fit:cover
}
.shade{
 position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(to bottom,

 rgba(0,0,0,.12) 58%,rgba(0,0,0,.84) 100%)
}
.details{
 position:absolute;z-index:2;
 left:26px;right:26px;bottom:25px;
 display:flex;flex-direction:column;
 align-items:flex-start;pointer-events:none
}
.brand{
 position:relative;width:100%;
 height:90px;margin-bottom:10px;
 flex-shrink:0
}
.logo{
 position:absolute;left:0;bottom:0;
 width:370px;max-width:75%;height:90px;
 object-fit:contain;object-position:left bottom;
 filter:drop-shadow(0 2px 6px rgba(0,0,0,.55))
}
.title{
 position:absolute;left:0;bottom:0;
 max-width:100%;max-height:2.2em;
 overflow:hidden;font-size:36px;
 font-weight:850;line-height:1.08;
 text-align:left;
 text-shadow:0 2px 7px rgba(0,0,0,.75)
}
.meta{
 display:flex;align-items:flex-start;
 gap:10px;width:100%;min-width:0
}
.platform-logo{
 display:block;max-width:52px;height:22px;
 object-fit:contain;flex-shrink:0;
 filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))
}
.meta-text{
 display:block;flex:1;min-width:0;
 font-size:22px;font-weight:500;line-height:1.28;
 color:#fff;opacity:.62;
 text-shadow:0 1px 3px rgba(0,0,0,.5);
 white-space:normal;overflow-wrap:break-word
}
.open{
 position:absolute;inset:0;z-index:3;
 display:block;width:100%;height:100%;
 border:0;border-radius:26px;outline:none;
 background:transparent;cursor:pointer;
 -webkit-tap-highlight-color:transparent
}
.card:focus-within::after,
.card.focused::after{
 content:"";position:absolute;z-index:4;
 inset:4px;border:5px solid #fff;
 border-radius:22px;
 box-shadow:0 0 0 2px rgba(0,0,0,.4),
 0 0 18px rgba(255,255,255,.4);
 pointer-events:none
}
.card:focus-within .poster,
.card.focused .poster{filter:brightness(1.07)}
.status{
 position:absolute;z-index:2;
 left:26px;right:26px;bottom:25px;
 font-size:18px
}
[hidden]{display:none!important}
</style>
</head>

<body>
<div class="card" id="card">
 <img class="poster" id="poster" alt="" hidden>
 <div class="shade"></div>

 <div class="details" id="details" hidden>
  <div class="brand">
   <img class="logo" id="logo" alt="" hidden>
   <div class="title" id="title" hidden></div>
  </div>

  <div class="meta" id="meta" hidden>
   <img class="platform-logo"
        id="platformLogo" alt="" hidden>
   <span class="meta-text" id="metaText" hidden></span>
  </div>
 </div>

 <span class="status" id="status">
  Waiting for titles
 </span>

 <a class="open" id="open" href="#"
    role="button" tabindex="0"
    aria-label="Open title"></a>
</div>

  var src=artworkValue(candidates[i]);
  if(src&&!failedFallbacks[src]&&src!==failedCleanPoster){

}

function railLogoRead(item){

  var key=keys[i]+':logo361',entry=railLogoMemory[key];
  if(!entry){try{entry=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}}

  var key=k+':logo361',entry={src:src,at:Date.now()};railLogoMemory[key]=entry;

}

  clean='';
  for(var i=0;i<available.length;i++){if(!failedFallbacks[available[i]]){clean=available[i];break;}}

/* Media type */

function typeLabel(item){

  item.mediaType,

  if(/^(movie|film|cinema)$/.test(t))
   return 'Movie';

  if(/^(tv|show|series|tv show|tv series|television)$/.test(t))
   return 'TV Show';
 }

 if(item.season!=null||item.episode!=null)
  return 'TV Show';

 return '';
}

function readGenres(value,out,depth){
 if(value==null||depth>6||out.length>=2)
  return;

 if(Array.isArray(value)){
  for(var i=0;i<value.length&&out.length<2;i++){
   readGenres(value[i],out,depth+1);
  }
  return;
 }

 if(typeof value==='object'){
  readGenres(
   value.title||value.name||value.label||
   value.genreTitle||value.genre||
   value.category||value.value,
   out,depth+1
  );
  return;
 }

 if(typeof value!=='string')return;

 var pieces=value.split(/[·•・|,;\/、，]+/);

 for(var j=0;j<pieces.length&&out.length<2;j++){
  var raw=pieces[j].trim();
  var key=fold(raw);

  if(!raw||
   /^(global rank|streaming trend rank)\s*\d+$/.test(key)||
   key==='trending worldwide'){
   continue;
  }

  if(Object.prototype.hasOwnProperty.call(COMBINED,key)){
   var pair=COMBINED[key];

   for(var p=0;p<pair.length&&out.length<2;p++){
    add(out,pair[p]);
   }

   continue;
  }

  if(Object.prototype.hasOwnProperty.call(GENRES,key)){
   add(out,GENRES[key]);
   continue;
  }

  var split=raw.split(/\s+(?:and|&)\s+|\s*＆\s*/i);

  if(split.length>1){
   for(var k=0;k<split.length&&out.length<2;k++){
    readGenres(split[k],out,depth+1);
   }
  }else if(raw.length<=40){
   add(out,raw);
  }
 }
}

function firstTwoGenres(item){
 var genres=[];
 if(!item)return genres;

 var fields=[
  item.genreItems,item.genreTitle,
  item.genres,item.genreList,
  item.genre,item.genreName,
  item.categories,item.category,
  item.categoryTitle
 ];

 for(var i=0;i<fields.length&&genres.length<2;i++){
  readGenres(fields[i],genres,0);
 }

 var m=item.metadata;

 if(m&&typeof m==='object'&&genres.length<2){
  var more=[
   m.genreItems,m.genreTitle,
   m.genres,m.genre,m.categories
  ];

  for(var j=0;j<more.length&&genres.length<2;j++){
   readGenres(more[j],genres,0);
  }
 }

 return genres;
}

function infoLabel(item){
 if(!item)return '';

 var values=[];
 var type=typeLabel(item);

 if(type)add(values,type);

 var genres=firstTwoGenres(item);

 for(var i=0;i<genres.length;i++){
  add(values,genres[i]);
 }

 return values.join(' \u00b7 ');
}

function updateLayout(){
 var layout=api.layout||{};
 var height=Number(layout.height);

 if(Number.isFinite(height)&&height>0){
  if(el('card').style.height!==height+'px'){
   el('card').style.height=height+'px';
  }
 }

 var width=Number(layout.width)||560;

 el('title').style.fontSize=
  Math.max(24,Math.min(36,width*.06))+'px';
}

function render(){
 var snapshot=api.content;

 /* Ignore initial unavailable metadata. */
 if(!snapshot)return;

 var items=snapshot.items||[];
 var item=items[0]||null;

 if(!item){
  // Empty interim snapshots can occur during native rail recycling.
  // Keep the displayed card but disable opening until a real item returns.
  if(selected||displayedPoster||pendingPoster){
   if(pendingPoster){imageGeneration++;pendingPoster='';}
   selected=null;
   el('open').tabIndex=-1;
   return;
  }
  currentKey='';
  clearTitleImages();
  el('details').hidden=true;
  el('status').hidden=false;
  el('status').textContent='No titles available';
  el('open').tabIndex=-1;
  return;
 }

 var key=titleKey(item);

 if(key!==currentKey){
  currentKey=key;
  clearTitleImages();
 }

 selected=item;
 var name=nameOf(item);

 var art=lockArtwork(item);
 updatePoster(item,art);
 if(art&&!art.logo&&!fixedRailRule(item)){
  // Accept a late logo only; never replace an already selected poster.
  art.logo=artworkValue(item.titleLogoPath)||artworkValue(item.titleLogoUrl)||artworkValue(item.logoPath);
  if(art.logo)railArtRemember(item,art.poster,art.logo);
 }
 syncPosterBrand(item,art);

 var info=infoLabel(item);

 if(el('metaText').textContent!==info){
  el('metaText').textContent=info;
 }

 el('metaText').hidden=!info;

 updateImage('platformLogo',networkLogoOf(item));

 el('meta').hidden=
  !(info||!el('platformLogo').hidden);

 el('details').hidden=false;
 el('status').hidden=true;

 el('open').tabIndex=0;
 el('open').setAttribute(
  'aria-label','Open '+name
 );

 updateLayout();
}

function openSelected(){
 if(!selected)return;

 var now=Date.now();
 if(now-lastOpen<350)return;

 var id=selected.id;
 if(id==null||id==='')return;

 if(typeof api.canOpen==='function'&&
  !api.canOpen('item',id)){
  return;
 }

 lastOpen=now;

 try{
  var result=api.open('item',id);

  if(result&&typeof result.catch==='function'){
   result.catch(function(){});
  }
 }catch(e){}
}

var link=el('open');

link.addEventListener('click',function(e){
 e.preventDefault();
 openSelected();
});

link.addEventListener('focus',function(){
 el('card').classList.add('focused');
});

link.addEventListener('blur',function(){
 el('card').classList.remove('focused');
});

link.addEventListener('keydown',function(e){
 if(e.key==='Enter'||e.key==='Select'||
  e.key===' '||e.keyCode===13||e.keyCode===23){
  e.preventDefault();
  openSelected();
 }
});

if(api){
 api.onContentChanged(render);
 api.onLayoutChanged(updateLayout);
 render();
}

})();
